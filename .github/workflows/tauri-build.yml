name: 🚀 Tauri Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    name: 🍎 macOS – DMG
    runs-on: macos-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 安装前端依赖
        run: npm ci

      - name: 🦀 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 🏗️ 构建 Tauri 应用（macOS）
        uses: tauri-apps/tauri-action@action-v0.6.2
        id: tauri_build_macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retryAttempts: 1
          # DMG → macOS 磁盘映像安装包
          args: --bundles dmg --ci

      - name: 📤 上传 DMG 安装包
        uses: actions/upload-artifact@v4
        with:
          name: file-visual-manager-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 🧾 上传 macOS 打包诊断文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: file-visual-manager-macos-diagnostics
          path: src-tauri/target/release/bundle
          if-no-files-found: warn

  build-windows:
    name: 🪟 Windows – EXE
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 安装前端依赖
        run: npm ci

      - name: 🦀 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # Windows 额外工具 — Wix 用于 .msi，NSIS 用于 .exe
      - name: 🧰 安装 NSIS（.exe 安装包工具）
        run: |
          choco install nsis -y --no-progress
        shell: pwsh

      - name: 🏗️ 构建 Tauri 应用（Windows）
        uses: tauri-apps/tauri-action@action-v0.6.2
        id: tauri_build_windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retryAttempts: 1
          # nsis → 生成 .exe 安装程序；也可追加 msi 以同时生成 MSI 包
          args: --bundles nsis --ci

      - name: 📤 上传 EXE 安装包
        uses: actions/upload-artifact@v4
        with:
          name: file-visual-manager-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 🧾 上传 Windows 打包诊断文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: file-visual-manager-windows-diagnostics
          path: src-tauri/target/release/bundle
          if-no-files-found: warn
