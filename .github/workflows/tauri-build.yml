# Tauri 跨平台构建工作流
# 在推送或 PR 到 main 时自动打包 Windows (.exe / .msi) 和 macOS (.dmg) 安装包
# 参考：https://v2.tauri.app/start/workflows/ci/

name: 🚀 Tauri Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────
  # macOS 构建 → 产出 .dmg
  # ──────────────────────────────────────
  build-macos:
    name: 🍎 macOS – DMG
    runs-on: macos-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 安装前端依赖
        run: npm ci

      - name: 🦀 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 🏗️ 构建 Tauri 应用（macOS）
        uses: tauri-apps/tauri-action@v2
        id: tauri_build_macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # DMG → macOS 磁盘映像安装包
          args: --bundles dmg

      - name: 📤 上传 DMG 安装包
        uses: actions/upload-artifact@v4
        with:
          name: file-visual-manager-macos
          path: ${{ steps.tauri_build_macos.outputs.artifactPath }}/*
          if-no-files-found: error

  # ──────────────────────────────────────
  # Windows 构建 → 产出 .exe 安装程序
  # ──────────────────────────────────────
  build-windows:
    name: 🪟 Windows – EXE
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 安装前端依赖
        run: npm ci

      - name: 🦀 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # Windows 额外工具 — Wix 用于 .msi，NSIS 用于 .exe
      - name: 🧰 安装 NSIS（.exe 安装包工具）
        run: |
          choco install nsis -y --no-progress
        shell: pwsh

      - name: 🏗️ 构建 Tauri 应用（Windows）
        uses: tauri-apps/tauri-action@v2
        id: tauri_build_windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # exe → NSIS 安装程序；也可追加 msi 以同时生成 MSI 包
          args: --bundles exe

      - name: 📤 上传 EXE 安装包
        uses: actions/upload-artifact@v4
        with:
          name: file-visual-manager-windows
          path: ${{ steps.tauri_build_windows.outputs.artifactPath }}/*
          if-no-files-found: error
